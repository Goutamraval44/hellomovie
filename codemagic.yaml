workflows:
  react-native-release:
    name: React Native Android Release Build
    max_build_duration: 60
    environment:
      node: 20.18.1
      java: 17

    scripts:
      - name: Clean parent package files
        script: |
          rm -f /Users/builder/yarn.lock
          rm -f /Users/builder/package.json

      - name: Install dependencies
        script: |
          cd /Users/builder/clone
          yarn install

      - name: Build Android APK (Release)
        script: |
          cd /Users/builder/clone/android
          ./gradlew assembleRelease

    artifacts:
      - /Users/builder/clone/android/app/build/outputs/apk/release/app-release.apk

   
