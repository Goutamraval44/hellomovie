workflows:
  android-release:
    name: React Native Android APK
    max_build_duration: 60
    environment:
      node: 20.18.1
      java: 17
      vars:
        PACKAGE_NAME: "com.hellomovie"
        VERSION_NAME: "1.0.0"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "*"
          include: true

    scripts:
      - name: Install dependencies
        script: |
          yarn install

      - name: Patch NativeWind (only if using NativeWind)
        script: |
          # Only needed if NativeWind gives async PostCSS error
          echo '#!/bin/bash' > patch-nativewind.sh
          echo 'sed -i "s/process(css)/process(css).then(cb)/g" node_modules/nativewind/dist/index.js' >> patch-nativewind.sh
          chmod +x patch-nativewind.sh
          ./patch-nativewind.sh

      - name: Bundle JS & assets
        script: |
          mkdir -p android/app/src/main/assets
          yarn react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Clean Gradle
        script: |
          cd android
          ./gradlew clean

      - name: Build APK
        script: |
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/**/*.apk
