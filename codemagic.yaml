workflows:
  android-release:
    name: React Native Android APK
    max_build_duration: 60
    environment:
      node: 20.18.1
      java: 17

    scripts:
      - name: Enable Corepack & Set Yarn 4.9.2
        script: |
          corepack enable
          corepack prepare yarn@4.9.2 --activate

      - name: Install dependencies
        script: |
          yarn install

      - name: Patch NativeWind (optional)
        script: |
          echo '#!/bin/bash' > patch-nativewind.sh
          echo 'sed -i "s/process(css)/process(css).then(cb)/g" node_modules/nativewind/dist/index.js' >> patch-nativewind.sh
          chmod +x patch-nativewind.sh
          ./patch-nativewind.sh

      - name: Bundle JS and assets
        script: |
          mkdir -p android/app/src/main/assets
          yarn react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Clean Gradle
        script: |
          cd android
          ./gradlew clean

      - name: Build APK
        script: |
          cd android
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/**/*.apk
