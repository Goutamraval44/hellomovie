workflows:
  react-native-release:
    name: React Native Android Release Build
    max_build_duration: 60
    environment:
      node: 20.18.1
      java: 17

    scripts:
      - name: Clean parent package files
        script: |
          rm -f /Users/builder/yarn.lock
          rm -f /Users/builder/package.json

      - name: Install dependencies
        script: |
          cd /Users/builder/clone
          yarn install

      - name: Patch NativeWind for async PostCSS error
        script: |
          cd /Users/builder/clone
          FILE="node_modules/nativewind/dist/postcss/extract-styles.js"
          echo "Checking NativeWind patch at: $FILE"

          if grep -q ".process(cssInput).css;" "$FILE"; then
            echo "Patching NativeWind..."
            sed -i '' 's|(0, postcss_1.default)(plugins).process(cssInput).css;|return await (0, postcss_1.default)(plugins).process(cssInput).then(r => r.css);|' "$FILE"
            sed -i '' 's/function extractStyles/function async extractStyles/' "$FILE"
            echo "Patch complete."
          else
            echo "Pattern not found in $FILE"
            head -n 60 "$FILE" | tail -n 40
            exit 1
          fi

      - name: Pre-bundle JS (to catch errors early)
        script: |
          cd /Users/builder/clone
          mkdir -p android/app/src/main/assets
          yarn react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build Android APK (Release)
        script: |
          cd /Users/builder/clone/android
          chmod +x gradlew
          ./gradlew assembleRelease

    artifacts:
      - /Users/builder/clone/android/app/build/outputs/apk/release/app-release.apk
