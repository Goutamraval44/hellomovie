workflows:
  react-native-release:
    name: React Native Android Release Build
    max_build_duration: 60
    environment:
      node: 20.18.1
      java: 17

    scripts:
      - name: Clean parent package files
        script: |
          rm -f /Users/builder/yarn.lock
          rm -f /Users/builder/package.json

      - name: Install dependencies
        script: |
          cd /Users/builder/clone
          yarn install

      - name: Patch NativeWind for async PostCSS error
        script: |
          echo '#!/bin/bash' > patch-nativewind.sh
          echo 'FILE="node_modules/nativewind/dist/postcss/extract-styles.js"' >> patch-nativewind.sh
          echo 'sed -i.bak "s/process(css).css/await process(css).then(r => r.css)/" $FILE' >> patch-nativewind.sh
          echo 'sed -i.bak "s/const result = process(css)/const result = await process(css)/" $FILE' >> patch-nativewind.sh
          chmod +x patch-nativewind.sh
          ./patch-nativewind.sh

      - name: Pre-bundle JS (to catch errors early)
        script: |
          cd /Users/builder/clone
          mkdir -p android/app/src/main/assets
          yarn react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build Android APK (Release)
        script: |
          cd /Users/builder/clone/android
          chmod +x gradlew
          ./gradlew assembleRelease

    artifacts:
      - /Users/builder/clone/android/app/build/outputs/apk/release/app-release.apk
