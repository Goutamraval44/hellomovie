workflows:
  react-native-debug:
    name: React Native Android Debug Build (Auto-Signed)
    max_build_duration: 60
    environment:
      node: 20.18.1
      java: 17

    scripts:
      - name: Clean parent package files
        script: |
          rm -f /Users/builder/yarn.lock
          rm -f /Users/builder/package.json

      - name: Install dependencies
        script: |
          cd /Users/builder/clone
          yarn install

      - name: Install metro-react-native-babel-transformer
        script: |
          cd /Users/builder/clone
          yarn add metro-react-native-babel-transformer --dev

      - name: Patch NativeWind for async PostCSS error
        script: |
          cd /Users/builder/clone

          echo "Patching NativeWind..."

          # Patch extract-styles.js
          FILE1="node_modules/nativewind/dist/postcss/extract-styles.js"
          if [ -f "$FILE1" ]; then
            sed -i '' 's|process(cssInput).css;|process(cssInput).then(r => r.css);|' "$FILE1"
            sed -i '' 's|function extractStyles|async function extractStyles|' "$FILE1"
            echo "Patched: extract-styles.js"
          fi

          # Patch postcss/index.js
          FILE2="node_modules/nativewind/postcss/index.js"
          if [ -f "$FILE2" ]; then
            sed -i '' 's|return postcss(plugins).process(css, options)|return await postcss(plugins).process(css, options)|' "$FILE2"
            sed -i '' 's|function process(|async function process(|' "$FILE2"
            echo "Patched: postcss/index.js"
          fi

      - name: Pre-bundle JS (to catch errors early)
        script: |
          cd /Users/builder/clone
          mkdir -p android/app/src/main/assets
          yarn react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Increase Gradle heap size
        script: |
          export _JAVA_OPTIONS="-Xmx4096m"

      - name: Build Android APK (Debug)
        script: |
          cd /Users/builder/clone/android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - /Users/builder/clone/android/app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - gcraval044@gmail.com
        notify:
          success: true
          failure: true

