workflows:
  react-native-debug:
    name: React Native Android Debug Build (Auto-Signed)
    max_build_duration: 60
    environment:
      node: 20.18.1
      java: 17

    scripts:
      - name: Clean parent package files
        script: |
          rm -f /Users/builder/yarn.lock
          rm -f /Users/builder/package.json

      - name: Install dependencies
        script: |
          cd /Users/builder/clone
          yarn install

      - name: Patch NativeWind for async PostCSS error
        script: |
          cd /Users/builder/clone
          FILE="node_modules/nativewind/dist/postcss/extract-styles.js"
          echo "Verifying NativeWind patch at: $FILE"

          if grep -q ".process(cssInput).css;" "$FILE"; then
            echo "Patching NativeWind..."
            sed -i '' 's|(0, postcss_1.default)(plugins).process(cssInput).css;|return await (0, postcss_1.default)(plugins).process(cssInput).then(r => r.css);|' "$FILE"
            sed -i '' 's|function extractStyles|async function extractStyles|' "$FILE"
            echo "NativeWind patch complete."
          else
            echo "Patch skipped: Already applied or pattern not found."
          fi

      - name: Pre-bundle JS (to catch errors early)
        script: |
          cd /Users/builder/clone
          mkdir -p android/app/src/main/assets
          yarn react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build Android APK (Debug)
        script: |
          cd /Users/builder/clone/android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - /Users/builder/clone/android/app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - gcraval044@gmail.com
        notify:
          success: true
          failure: true

