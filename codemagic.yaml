workflows:
  android-release:
    name: React Native APK (Yarn v1)
    max_build_duration: 60
    environment:
      node: 20.18.1
      java: 17

    scripts:
      - name: Install Yarn Classic
        script: |
          npm install -g yarn@1.22.22

      - name: Install dependencies
        script: |
          yarn install

      - name: Patch NativeWind (optional)
        script: |
          echo '#!/bin/bash' > patch-nativewind.sh
          echo 'sed -i "s/process(css)/process(css).then(cb)/g" node_modules/nativewind/dist/index.js' >> patch-nativewind.sh
          chmod +x patch-nativewind.sh
          ./patch-nativewind.sh

      - name: Bundle assets
        script: |
          mkdir -p android/app/src/main/assets
          yarn react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Clean Gradle
        script: |
          cd android
          ./gradlew clean

      - name: Build APK
        script: |
          cd android
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/**/*.apk

