workflows:
  react-native-release:
    name: React Native Android Release Build
    max_build_duration: 60
    environment:
      node: 20.18.1
      java: 17

    scripts:
      - name: Clean parent package files
        script: |
          rm -f /Users/builder/yarn.lock
          rm -f /Users/builder/package.json

      - name: Install dependencies
        script: |
          cd /Users/builder/clone
          yarn install

      - name: Patch NativeWind for async PostCSS error
        script: |
          cd /Users/builder/clone
          FILE="node_modules/nativewind/dist/postcss/extract-styles.js"
          echo "Verifying NativeWind patch path: $FILE"
          if grep -q "process(css).css" "$FILE"; then
            echo "Patching NativeWind..."
            sed -i '' 's/process(css).css/await process(css).then(r => r.css)/' "$FILE"
            sed -i '' 's/const result = process(css)/const result = await process(css)/' "$FILE"
            echo "Patch applied successfully"
          else
            echo "Pattern not found, showing lines around line 30:"
            head -n 40 "$FILE" | tail -n 20
            exit 1
          fi

      - name: Pre-bundle JS (to catch errors early)
        script: |
          cd /Users/builder/clone
          mkdir -p android/app/src/main/assets
          yarn react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build Android APK (Release)
        script: |
          cd /Users/builder/clone/android
          chmod +x gradlew
          ./gradlew assembleRelease

    artifacts:
      - /Users/builder/clone/android/app/build/outputs/apk/release/app-release.apk

